name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pi packages must not rely on lifecycle scripts.
      - run: npm install --no-audit --no-fund --ignore-scripts

      - run: npm test
      - run: npm run typecheck
